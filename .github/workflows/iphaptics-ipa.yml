name: Build IPHaptics (unsigned IPA)

on:
  workflow_dispatch:
  push:
    tags:
      - "iphaptics-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: IPHaptics
        run: xcodegen generate

      - name: Build for iPhone (unsigned)
        working-directory: IPHaptics
        run: |
          set -o pipefail
          xcodebuild -project IPHaptics.xcodeproj -scheme IPHaptics \
            -sdk iphoneos -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | tail -n 80

      - name: Package the IPA
        working-directory: IPHaptics
        run: |
          rm -rf Payload IPHaptics-unsigned.ipa
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/IPHaptics.app Payload/
          zip -qry IPHaptics-unsigned.ipa Payload
          ls -la IPHaptics-unsigned.ipa
          unzip -l IPHaptics-unsigned.ipa | tail -n 15

      - uses: actions/upload-artifact@v4
        with:
          name: IPHaptics-unsigned-ipa
          path: IPHaptics/IPHaptics-unsigned.ipa

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/iphaptics-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" IPHaptics/IPHaptics-unsigned.ipa \
            --title "IPHaptics ${GITHUB_REF_NAME#iphaptics-v} (unsigned IPA)" \
            --notes-file IPHaptics/RELEASE_NOTES.md
